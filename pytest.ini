[pytest]
testpaths = tests
addopts = -v --tb=short
markers =
    radio: Radio button tests
    dropdown: Dropdown tests
    checkbox: Checkbox tests
    autocomplete: Autocomplete / suggestion tests
    windows: Window and tab switching tests
    alerts: Alert and confirm dialog tests
    hover: Mouse hover tests
    tables: Web table tests
    iframe: iFrame tests
    visibility: Element show/hide tests
